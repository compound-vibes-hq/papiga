<style>

label{display:block;font-size:14px;color:var(--mut);margin:10px 0 4px}select,input,textarea{width:100%;padding:10px;border:1px solid #ddd;border-radius:10px;font:inherit}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chip{border:2px solid #eee;background:#fff;border-radius:12px;padding:8px 12px;font-size:17px;font-weight:700;cursor:pointer}.chip[aria-pressed=true]{border-color:var(--pri);background:#fff3ec}
.btn{border:0;border-radius:14px;padding:12px 18px;font-size:16px;font-weight:600;cursor:pointer;background:var(--pri);color:#fff}.btn.sec{background:#f3ece4;color:var(--ink)}
.btn.sm{padding:6px 10px;font-size:14px;border-radius:10px}.btn.rec{background:#e63946}

.prog{height:12px;background:#eee;border-radius:99px;overflow:hidden}.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--pri2),var(--pri))}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}.ok{background:var(--ok)}.again{background:var(--pri2);color:#3a2a00}
.stk{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;font-size:30px;text-align:center}.stk span{background:#fff8ef;border-radius:12px;padding:4px}.stk .lock{filter:grayscale(1);opacity:.25}
.cele{position:fixed;inset:0;background:#0006;display:none;place-items:center;z-index:9}.cele.on{display:grid}.cele .card{text-align:center;max-width:340px;animation:pop .5s}

.stk button{background:#fff8ef;border:2px solid transparent;border-radius:12px;padding:4px;font-size:30px;cursor:pointer;line-height:1.2}.stk button:hover{border-color:var(--pri)}
/* Risanke */
.ris{position:fixed;inset:0;z-index:20;display:none;overflow:hidden;cursor:pointer}.ris.on{display:block}
.ris .act{position:absolute;transform:translate(-50%,-50%);line-height:1}.ris .act span{display:inline-block}
.ris .txt{font-weight:900;color:#e63946;text-shadow:3px 3px 0 #fff;font-family:system-ui,sans-serif}

@keyframes bar{from{width:0}to{width:100%}}
@keyframes capin{from{opacity:0;transform:translate(-50%,20px)}to{opacity:1;transform:translate(-50%,0)}}
@keyframes rise{from{transform:translateY(60vh) scale(.3)}to{transform:none}}
@keyframes twinkle{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.3);opacity:.6}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
@keyframes across{from{transform:translateX(-80vw)}to{transform:translateX(80vw)}}

@keyframes hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-24px)}}

@keyframes drop{0%{transform:translateY(-70vh)}60%{transform:translateY(0)}75%{transform:translateY(-30px)}100%{transform:translateY(0)}}
@keyframes spin{from{transform:scale(.2) rotate(-360deg)}to{transform:scale(1) rotate(0)}}
@keyframes float{from{transform:translate(0,45vh)}25%{transform:translate(-30px,20vh)}50%{transform:translate(30px,0)}75%{transform:translate(-20px,-20vh)}to{transform:translate(0,-40vh)}}

@keyframes fadein{from{opacity:0}to{opacity:1}}

@keyframes pop2{0%,55%{opacity:0;transform:scale(.4)}70%{opacity:1;transform:scale(1.25)}100%{opacity:1;transform:scale(1)}}
@media (prefers-reduced-motion:reduce){.ris *{animation:none!important}}

.klepet{display:flex;flex-direction:column;gap:6px;max-height:320px;overflow:auto}.msg{background:#f6fbfd;border-radius:12px;padding:8px 10px;font-size:14px;max-width:85%;align-self:flex-start;white-space:pre-wrap;overflow-wrap:anywhere}.msg.moj{background:#fff3ec;align-self:flex-end}.msg small{display:block;color:var(--mut);font-size:11px;margin-bottom:2px}

.spomin{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}

.izbire{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}.izb{font-size:56px;background:#fff;border:3px solid #eee;border-radius:18px;padding:10px;cursor:pointer}.izb:hover{border-color:var(--pri)}
.igmsg{font-size:20px;text-align:center;min-height:28px}
:focus-visible{outline:3px solid #1d4ed8;outline-offset:2px}
</style></head><body>
<header><h1>🦜 <span>Papiga</span></h1><button class="btn sm" id="namesti" hidden>📲 Namesti aplikacijo</button><nav role="tablist" id="tabs"></nav></header>
<main id="app"></main>
<div class="cele" id="cele" role="dialog" aria-modal="true" aria-labelledby="celeT"></div>
<div class="ris" id="ris" role="dialog" aria-modal="true" onclick="zapriRis()"></div>
<div class="igra" id="igra" role="dialog" aria-modal="true" aria-label="Igra"></div>
<footer>Prototip – ni medicinski pripomoček; vaje določi logoped. · Podatki so v tej napravi. Če otroka povežete (☁️), se kopija hrani v oblaku v EU.</footer>
<script>
/* ---------- Besede: [beseda, emoji] ----------
   Konec besede pri Z in Ž je namenoma izpuščen (razzvenevanje: voz [vos], nož [noš]).
   Konec besede pri L je izpuščen, dokler logoped ne potrdi seznama (končni l se pogosto izgovori kot [u]). */
const W={
S:{z:[["sok","🧃"],["sir","🧀"],["sova","🦉"],["slon","🐘"],["sani","🛷"],["sladoled","🍦"],["sneg","❄️"],["solata","🥗"],["smreka","🌲"],["stol","🪑"]],s:[["pesek","🏖️"],["nosorog","🦏"],["kosilo","🍽️"],["maska","🎭"],["kost","🦴"],["mesto","🏙️"],["pismo","✉️"],["list","🍃"],["lestev","🪜"],["vesla","🚣"]],k:[["nos","👃"],["pes","🐶"],["las","💇"],["kokos","🥥"],["ananas","🍍"],["avtobus","🚌"],["kaktus","🌵"],["ples","💃"],["les","🪵"],["vas","🏘️"]]},
Z:{z:[["zob","🦷"],["zvezda","⭐"],["zebra","🦓"],["zmaj","🐉"],["zelenjava","🥦"],["zima","☃️"],["zid","🧱"],["zemlja","🌍"],["zelje","🥬"],["zaklad","💰"]],s:[["koza","🐐"],["vaza","🏺"],["koruza","🌽"],["jezik","👅"],["grozdje","🍇"],["vozilo","🚗"],["jezero","🏞️"],["breza","🌳"],["lizika","🍭"],["bazen","🏊"]]},
C:{z:[["cvet","🌸"],["copat","🥿"],["citrona","🍋"],["cerkev","⛪"],["cekin","🪙"],["cvetlica","🌷"],["cilj","🎯"],["cena","🏷️"]],s:[["ovca","🐑"],["ptica","🐦"],["jajce","🥚"],["kocka","🎲"],["raca","🦆"],["opica","🐒"],["mucka","🐱"],["pica","🍕"],["vilice","🍴"],["kapica","🧢"]],k:[["lonec","🍲"],["palec","👍"],["konec","🏁"],["pajac","🤡"],["lovec","🏹"],["muc","🐱"],["pevec","🎤"],["robec","🤧"],["vrabec","🐦"]]},
"Š":{z:[["šola","🏫"],["škatla","📦"],["šal","🧣"],["šopek","💐"],["šotor","⛺"],["škarje","✂️"],["šah","♟️"],["šapa","🐾"],["škorenj","👢"],["šivanka","🪡"]],s:[["miška","🐭"],["hiša","🏠"],["hruška","🍐"],["kaša","🥣"],["pošta","📮"],["piškot","🍪"],["lešnik","🌰"],["košara","🧺"],["mašna","🎀"]],k:[["miš","🐁"],["koš","🧺"],["tuš","🚿"],["kokoš","🐔"]]},
"Ž":{z:[["žoga","⚽"],["žaba","🐸"],["žirafa","🦒"],["želva","🐢"],["žaga","🪚"],["žemlja","🥖"],["žuželka","🐞"],["žebelj","🔩"],["žerjav","🏗️"],["žito","🌾"]],s:[["roža","🌹"],["luža","💧"],["kuža","🐶"],["mreža","🥅"],["družina","👪"],["možgani","🧠"],["kožuh","🧥"],["ježek","🦔"],["požar","🔥"]]},
"Č":{z:[["čebela","🐝"],["čaj","🍵"],["čevelj","👞"],["čoln","🛶"],["čokolada","🍫"],["čarovnik","🧙"],["čelada","⛑️"],["čebula","🧅"],["čopič","🖌️"],["čuk","🦉"]],s:[["mačka","🐱"],["očala","👓"],["kača","🐍"],["račka","🐤"],["hlače","👖"],["oči","👀"],["koča","🛖"],["rokavičke","🧤"],["učitelj","🧑‍🏫"],["buča","🎃"]],k:[["ključ","🔑"],["meč","🗡️"],["kolač","🥧"],["kovač","🔨"],["obroč","⭕"],["ribič","🎣"],["čopič","🖌️"],["luč","💡"],["noč","🌃"]]},
L:{z:[["lev","🦁"],["luna","🌙"],["lonec","🍲"],["list","🍃"],["limona","🍋"],["ladja","🚢"],["lizika","🍭"],["lubenica","🍉"],["letalo","✈️"],["lisica","🦊"]],s:[["balon","🎈"],["kolo","🚲"],["jelen","🦌"],["milo","🧼"],["šola","🏫"],["telefon","📞"],["kolač","🥧"],["palačinke","🥞"],["golob","🕊️"],["čebela","🐝"]]},
R:{z:[["riba","🐟"],["roka","✋"],["raca","🦆"],["robot","🤖"],["raketa","🚀"],["rak","🦀"],["roža","🌹"],["rokavica","🧤"],["rakun","🦝"],["radio","📻"]],s:[["ura","⏰"],["torba","👜"],["krava","🐄"],["žirafa","🦒"],["korenje","🥕"],["hruška","🍐"],["drevo","🌳"],["kruh","🍞"],["grad","🏰"],["morje","🌊"]],k:[["sir","🧀"],["tiger","🐯"],["kuhar","🧑‍🍳"],["mornar","⚓"],["bobnar","🥁"],["dar","🎁"],["veter","🌬️"],["papir","📄"]]}};
const POS={z:"začetek",s:"sredina",k:"konec"},ST=["⭐","🦄","🐙","🚀","🌈","🦖","🎈","🐢","🍓","🏆","🐝","🌻"];
const DN=["pon","tor","sre","čet","pet","sob","ned"];
const POSX={...POS,p:"povedi",g:"zgodba"};

/* ---------- Datumi ---------- */
const iso=d=>{const x=new Date(d);x.setMinutes(x.getMinutes()-x.getTimezoneOffset());return x.toISOString().slice(0,10)};
const danes=()=>iso(new Date());
const premik=n=>{const d=new Date();d.setDate(d.getDate()+n);return iso(d)};
function teden(){const dow=(new Date().getDay()+6)%7;return DN.map((_,i)=>premik(i-dow))}
function dniTeden(k){const t=teden();return t.filter(d=>k.dnevi.includes(d)).length}
function niz(k){const s=new Set(k.dnevi);const o=s.has(danes())?0:-1;let n=0;while(s.has(premik(o-n)))n++;return n}

/* ---------- Podatki ---------- */
function seed(){const d=a=>a.map(premik);return {v:2,aktiven:1,vloga:"logoped",kids:[
{id:1,uid:"demo-lana",ime:"Lana",starost:5,av:"🦊",sklop:{glas:"Š",poz:"z",pon:2,opomba:"Vadite zjutraj, ko je Lana spočita. Pohvalite vsak poskus."},dnevi:d([-1,-2,-3,-5]),stat:{"Š-z":[34,46],"S-z":[40,44]},kom:["Pri besedi škatla se je še malo zatikalo, šola gre odlično!","Lana je sama prosila za vaje 😊"],zvezde:41,nalepke:5,nagradaDan:null,vaja:null},
{id:2,uid:"demo-jakob",ime:"Jakob",starost:6,av:"🐻",sklop:{glas:"R",poz:"s",pon:3,opomba:"Pred vajo naj se igra z jezikom (»konjiček«)."},dnevi:d([-1,-2,-4]),stat:{"R-s":[18,40],"L-z":[30,33]},kom:["R v sredini še težko, pri »ura« je bil zelo ponosen."],zvezde:22,nalepke:3,nagradaDan:null,vaja:null},
{id:3,uid:"demo-ema",ime:"Ema",starost:4,av:"🐼",sklop:{glas:"C",poz:"k",pon:2,opomba:"Kratke vaje, največ 5 minut."},dnevi:d([-1,-2,-3,-4,-5]),stat:{"C-k":[38,42],"S-z":[25,30],"Z-z":[20,28]},kom:["Vsak dan po vrtcu, gre ji vedno bolje.","Zajec je njena najljubša kartica."],zvezde:63,nalepke:7,nagradaDan:null,vaja:null}]}}
function load(){try{const x=JSON.parse(localStorage.getItem("pzv2"));if(x&&x.v===2&&Array.isArray(x.kids))return x}catch(e){}return seed()}
let S=load();
function shrani(){try{localStorage.setItem("pzv2",JSON.stringify(S))}catch(e){}}
function save(){shrani();if(typeof oblakPlan=="function")oblakPlan()}

/* ---------- Posnetki (IndexedDB) ---------- */
const DB=(()=>{let p;const open=()=>p||(p=new Promise((res,rej)=>{const r=indexedDB.open("pzv-posnetki",1);r.onupgradeneeded=()=>r.result.createObjectStore("rec");r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}));
const tx=(m,fn)=>open().then(db=>new Promise((res,rej)=>{const t=db.transaction("rec",m),q=fn(t.objectStore("rec"));t.oncomplete=()=>res(q&&q.result);t.onerror=()=>rej(t.error)}));
return{get:k=>tx("readonly",s=>s.get(k)),put:(k,v)=>tx("readwrite",s=>s.put(v,k)),del:k=>tx("readwrite",s=>s.delete(k)),keys:()=>tx("readonly",s=>s.getAllKeys())}})();
let REC=new Set(),mr=null,recW=null;

/* ---------- Dodajanje / odstranjevanje otrok ---------- */
let dodaj=false,novAv="🐰";const AV=["🦊","🐻","🐼","🐰","🐸","🐯","🦁","🐨","🐵","🦄"];
const leta=n=>n==1?"leto":n==2?"leti":n<5?"leta":"let";
function dodajForm(){if(!dodaj)return `<button class="btn sec" style="width:100%;margin-top:8px" onclick="dodaj=true;render();setTimeout(()=>{const i=$('#nIme');if(i)i.focus()})">➕ Dodaj otroka</button>`;
return `<form onsubmit="return dodajOtroka(event)" style="margin-top:10px;border-top:1px solid #f1ebe4;padding-top:6px"><label for="nIme">Ime</label><input id="nIme" name="ime" required maxlength="30" autocomplete="off"><label for="nSt">Starost (let)</label><input id="nSt" name="st" type="number" min="1" max="18" value="5"><label>Ikona</label><div class="chips">${AV.map(a=>`<button type="button" class="chip" aria-pressed="${novAv==a}" aria-label="Ikona ${a}" onclick="novAv='${a}';this.parentNode.querySelectorAll('.chip').forEach(c=>c.setAttribute('aria-pressed',c===this))">${a}</button>`).join("")}</div><div class="row" style="margin-top:12px"><button class="btn" type="submit">Shrani</button><button class="btn sec" type="button" onclick="dodaj=false;cisti=true;render()">Prekliči</button></div></form>`}
function dodajOtroka(e){e.preventDefault();const f=e.target,ime=f.ime.value.trim(),st=Math.min(18,Math.max(1,Math.round(+f.st.value)||5));if(!ime){f.ime.focus();return false}

async function snemaj(w){

  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia||!window.MediaRecorder){naloziPosnetek(w);return}
  try{const st=await navigator.mediaDevices.getUserMedia({audio:true});const r=new MediaRecorder(st),ch=[];
    r.ondataavailable=e=>{if(e.data.size)ch.push(e.data)};
    r.onstop=async()=>{st.getTracks().forEach(t=>t.stop());mr=null;recW=null;
      if(ch.length){try{await DB.put(w,new Blob(ch,{type:r.mimeType||"audio/webm"}));REC.add(w);S.recT[w]=Date.now();save();toast2("Posnetek »"+w+"« je shranjen.")}catch(e){toast2("Posnetka ni bilo mogoče shraniti.")}}
      render()};
    r.start();mr=r;recW=w;render();setTimeout(()=>{if(mr===r)r.stop()},w.length>40?30000:w.length>14?9000:4000)
  }catch(e){toast2("Mikrofon ni dovoljen. Tapnite 📁 in besedo posnemite z aplikacijo telefona.")}}
function naloziPosnetek(w){const i=document.createElement("input");i.type="file";i.accept="audio/*";i.setAttribute("capture","");
  i.onchange=async()=>{const f=i.files&&i.files[0];if(!f)return;try{await DB.put(w,f);REC.add(w);S.recT[w]=Date.now();save();toast2("Posnetek »"+w+"« je shranjen.")}catch(e){toast2("Posnetka ni bilo mogoče shraniti.")}render()};i.click()}

return `<svg viewBox="0 0 400 ${e.length*46+10}" width="100%" role="img" aria-label="Delež pravilnih izgovorjav po glasovih in položajih">`+e.map(([g,[o,t]],i)=>{const p=Math.round(o/t*100),y=i*46+8;return `<text x="0" y="${y+21}" font-size="16" font-weight="700" fill="#2d2a32">${esc(lbl(g))}</text><rect x="130" y="${y}" width="200" height="30" rx="8" fill="#f3ece4"/><rect x="130" y="${y}" width="${2*p}" height="30" rx="8" fill="${p>=75?'#2a9d8f':p>=50?'#ffb703':'#ff8a5b'}"/><text x="340" y="${y+21}" font-size="16" fill="#2d2a32">${p} %</text>`}).join("")+"</svg>"}

function logoped(){const k=kid(),s=k.sklop,ws=kartice(k).map(x=>[x.w]);return `<div class="grid"><div><div class="card"><h2 style="margin-top:0">Moji otroci</h2>${S.kids.map(x=>`<div style="display:flex;align-items:center;gap:4px"><button class="kid" aria-pressed="${x.id==k.id}" onclick="S.aktiven=${x.id};save();render()"><span class="av">${x.av}</span><span><b>${esc(x.ime)}</b><br><small>${x.starost} ${leta(x.starost)} · ${x.sklop.sklopi.length>1?"glasovi":"glas"} ${x.sklop.sklopi.map(y=>y.glas).join(", ")}</small></span></button><button class="btn sec sm" onclick="odstrani(${x.id})" aria-label="Odstrani otroka ${esc(x.ime)}" title="Odstrani otroka">🗑</button></div>`).join("")}${S.kids.some(jeDemo)?`<p class="mut" style="font-size:13px;margin:8px 0 0">${S.kids.filter(jeDemo).map(x=>esc(x.ime)).join(", ")}: izmišljeni primeri za preizkus. <button class="btn sec sm" onclick="odstraniDemo()">Odstrani primere</button></p>`:""}${dodajForm()}</div>
<div class="card"><h3 style="margin-top:0">Dodeli vaje za domov</h3><label>Glasovi (izberete lahko več)</label><div class="chips">${Object.keys(W).map(g=>`<button class="chip" aria-pressed="${s.sklopi.some(x=>x.glas==g)}" onclick="setGlas('${g}')">${g}</button>`).join("")}</div>
<label>Položaj v besedi</label>${s.sklopi.map(x=>`<div class="row" style="align-items:center;gap:8px;margin-bottom:6px"><b style="width:28px;font-size:18px">${x.glas}</b><select id="poz-${x.glas}" aria-label="Položaj za glas ${x.glas}" style="flex:1" onchange="setPoz('${x.glas}',this.value)">${Object.keys(W[x.glas]).map(v=>`<option value="${v}" ${x.poz==v?"selected":""}>${POS[v]} besede</option>`).join("")}</select></div>`).join("")}
<label for="stop">Stopnja vaj</label><select id="stop" onchange="setStopnja(this.value)">${Object.entries(STOP_OPIS).map(([v,t])=>`<option value="${v}" ${s.stopnja==v?"selected":""}>${t}</option>`).join("")}</select>
<label for="pon">Ponovitve na dan (1–5)</label><input id="pon" type="number" min="1" max="5" step="1" value="${s.pon}" onchange="setPon(this.value)">
<label>Urnik vaj (starš ga lahko prilagodi)</label>${urnikHTML(k,"l")}
<label for="op">Opomba za starše</label><textarea id="op" rows="3" onchange="kid().sklop.opomba=this.value;zig(kid());save()">${esc(s.opomba)}</textarea>
<p class="mut" style="font-size:14px">Besede: ${s.sklopi.map(x=>`<b>${x.glas}</b>: ${W[x.glas][x.poz].map(w=>mark(w[0],x.glas,x.poz)).join(", ")}`).join(" · ")}<br>Stopnja: ${STOP_OPIS[s.stopnja]} · ${ws.length*s.pon} kartic na dan</p>
<div class="row" style="gap:8px"><button class="btn" onclick="dodeli()">Dodeli vaje</button>${k.koda?"":`<button class="btn sec" onclick="ustvariPovezavo()">🔗 Poveži s starši</button>`}</div><p id="toast" class="mut" role="status" style="font-size:14px;margin:8px 0 0"></p></div>
<div class="card"><h3 style="margin-top:0">🎙️ Posnetki besed</h3><p class="mut" style="font-size:14px;margin-top:0">Posnemite pravilno izgovorjavo. Otrok bo slišal vaš glas. Seznam velja za izbrano stopnjo. Snemanje se ustavi samo (besede po 4 s, povedi po 9 s, zgodbe po 30 s). Če mikrofon ni dovoljen (npr. na telefonu), tapnite 📁 in posnemite z aplikacijo telefona.</p>
${[...new Set(ws.map(x=>x[0]))].map(w=>`<div class="recrow"><b style="${w.length>14?"font-size:14px;font-weight:600":""}">${esc(w.length>60?w.slice(0,58)+"…":w)}</b>${REC.has(w)?`<button class="btn sec sm" data-w="${esc(w)}" onclick="predvajaj(this.dataset.w)" aria-label="Predvajaj ${esc(w)}">▶</button>`:""}<button class="btn sm ${recW==w?"rec":"sec"}" data-w="${esc(w)}" onclick="snemaj(this.dataset.w)" ${mr&&recW!=w?"disabled":""}>${recW==w?"⏹ Ustavi":REC.has(w)?"● Znova":"● Posnemi"}</button><button class="btn sec sm" data-w="${esc(w)}" onclick="naloziPosnetek(this.dataset.w)" aria-label="Posnemi ali izberi posnetek v telefonu za ${esc(w)}" title="Posnemi z aplikacijo telefona ali izberi datoteko">📁</button>${REC.has(w)&&recW!=w?`<button class="btn sec sm" data-w="${esc(w)}" onclick="izbrisi(this.dataset.w)" aria-label="Izbriši posnetek ${esc(w)}">🗑</button>`:""}</div>`).join("")}</div>${knjiznica()}</div>
<div><div class="card"><div class="row" style="justify-content:space-between;align-items:center"><h2 style="margin:0">${k.av} ${esc(k.ime)} – napredek ta teden</h2><button class="btn sec sm" onclick="odstrani()">🗑 Odstrani otroka</button></div><div class="row"><div class="stat"><small>Dni vadbe (urnik)</small><b>${dniTeden(k)} / ${planDni(k)}</b></div><div class="stat"><small>Niz dni</small><b>🔥 ${niz(k)}</b></div><div class="stat"><small>Zvezdice</small><b>⭐ ${k.zvezde}</b></div><div class="stat"><small>Trenutni sklop</small><b style="font-size:17px">${opis(k)}</b></div></div>
<h3>Dnevi vadbe</h3>${dayStrip(k)}
<h3>Delež potrjeno pravilnih (po oceni staršev)</h3>${chart(k)}<h3>💬 Sporočila s starši</h3>${klepet(k,"logoped")}</div>${oblakHTML("logoped")}</div></div>`}

function otrok(){const k=kid(),s=k.sklop,ws=words(),v=vaja(k),tot=ws.length*s.pon;
const izbira=`<select aria-label="Izberi otroka" style="width:auto;padding:6px 8px" onchange="S.aktiven=+this.value;save();render()">${S.kids.map(x=>`<option value="${x.id}" ${x.id==k.id?"selected":""}>${x.av} ${esc(x.ime)}</option>`).join("")}</select>`;
if(v.rep>=tot)return `<div class="phone"><div class="card" style="padding:12px 16px">${izbira}</div><div class="card wcard"><div class="pic">🏆</div><h2>Današnje vaje so opravljene!</h2><p>Bravo, ${esc(k.ime)}! Jutri nas čakajo nove kartice.</p><button class="btn big" onclick="znova()">Vadi še enkrat</button></div>${igreHTML()}${rewards(k)}</div>`;
const w=ws[v.i%ws.length];return `<div class="phone">${opomnik(k)}<div class="card" style="padding:12px 16px"><div class="row" style="justify-content:space-between;align-items:center">${izbira}<span>⭐ ${k.zvezde} · 🔥 ${niz(k)}</span></div><p style="margin:8px 0 0"><b>Živjo, ${esc(k.ime)}!</b></p><div class="prog" style="margin-top:10px" role="progressbar" aria-label="Napredek" aria-valuenow="${v.rep}" aria-valuemin="0" aria-valuemax="${tot}"><i style="width:${v.rep/tot*100}%"></i></div><small>Kartica ${v.rep+1} od ${tot} · glas ${w.glas}, ${POSX[w.poz]}</small></div>
<div class="card wcard">${karticaHTML(w)}
${REC.has(w.w)?`<button class="btn sec big" data-w="${esc(w.w)}" onclick="predvajaj(this.dataset.w)">🔊 Poslušaj${w.tip=="poved"?" poved":w.tip=="zgodba"?" zgodbo":" besedo"}</button><p class="mut" style="font-size:14px">Predvajajte posnetek, otrok ponovi.</p>`:`<p class="mut" style="font-size:15px">${NAVOD[w.tip||"beseda"]}</p>`}
<div class="two"><button class="btn big ok" onclick="ans(1)">✅ Pravilno</button><button class="btn big again" onclick="ans(0)">💪 Še vadimo</button></div></div>
${s.opomba?`<div class="card"><small>📝 Logoped: ${esc(s.opomba)}</small></div>`:""}${igreHTML()}${rewards(k)}</div>`}
function znova(){const k=kid();k.vaja={datum:danes(),i:0,rep:0,ok:0};save();render()}
function rewards(k){return `<div class="card"><h3 style="margin-top:0">Moja zbirka nalepk</h3>${k.nalepke?`<p class="mut" style="margin-top:-6px;font-size:14px">Tapni nalepko in poglej njeno risanko 🎬</p>`:""}<div class="stk">${ST.map((x,i)=>i<k.nalepke?`<button onclick="risanka('${x}')" aria-label="Poglej risanko">${x}</button>`:`<span class="lock" aria-label="zaklenjeno">${x}</span>`).join("")}</div></div>`}

   igralec: [emoji ali besedilo, x %, y %, velikost px, gibanje, notranje gibanje, stalna preobrazba] */

"🦖":{bg:"linear-gradient(#caf0f8,#b7e4c7)",t:"Dinozaver je zarjovel: RRRR!",a:[["🌴",14,58,90,""],["🌋",86,46,90,""],["🦖",50,62,130,"walkin 2s ease-out both","hop .4s ease-in-out 5","scaleX(-1)"],["RRRR!",50,28,56,"pop2 3s both"]]},

"🐢":{bg:"linear-gradient(#d8f3dc,#95d5b2)",t:"Počasi, a zanesljivo do cilja!",a:[["🏁",86,60,70,""],["🌼",20,82,40,""],["🌼",62,86,32,""],["🐢",50,66,110,"slow 4.5s linear both","hop .9s ease-in-out infinite","scaleX(-1)"]]},
"🍓":{bg:"linear-gradient(#fff0f3,#ffccd5)",t:"Mmm, sladke jagode!",a:[["🍓",40,62,64,"drop 1s .2s both"],["🍓",60,62,64,"drop 1s .8s both"],["🍓",50,58,72,"drop 1s 1.4s both"],["🧺",50,74,120,""],["💖",50,30,70,"pop2 3s 1s both"]]},

"🐝":{bg:"linear-gradient(#e0f7fa,#fff9c4)",t:"Bzzz! Čebelica leti na rožo.",a:[["🌻",80,68,110,"grow 1s both"],["🌼",20,78,50,""],["🐝",50,45,70,"loop 4.5s ease-in-out both","hop .3s ease-in-out infinite","scaleX(-1)"]]},
"🌻":{bg:"linear-gradient(#90e0ef,#ffe5b4 72%,#a7c957 72%)",t:"Sončnica raste proti soncu!",a:[["☀️",80,15,80,"twinkle 2s infinite"],["🌱",50,80,60,"fadeout 1.5s both"],["🌻",50,58,150,"grow 2s 1s ease-out both","shake 2s 3s ease-in-out infinite"]]}};
let risT=null;
function melodija(){try{const C=window.AudioContext||window.webkitAudioContext;if(!C)return;const c=new C(),t0=c.currentTime;[523,659,784,1047,784,1047].forEach((f,i)=>{const o=c.createOscillator(),g=c.createGain(),t=t0+i*.18;o.type="triangle";o.frequency.value=f;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.15,t+.02);g.gain.exponentialRampToValueAtTime(.001,t+.3);o.connect(g).connect(c.destination);o.start(t);o.stop(t+.35)});setTimeout(()=>c.close(),2500)}catch(e){}}
function risanka(e){const r=RIS[e];if(!r)return;const el=$("#ris");el.style.background=r.bg;
el.innerHTML=`<div class="bar"></div>`+r.a.map(([t,x,y,s,m,n,f])=>`<span class="act" aria-hidden="true" style="left:${x}%;top:${y}%;font-size:${s}px"><span style="${f?"transform:"+f:""}"><span style="animation:${m||"none"}"><span class="${/^[A-Z]/.test(t)?"txt":""}" style="animation:${n||"none"}">${t}</span></span></span></span>`).join("")+`<div class="cap">${r.t}</div><button class="btn sec sm zapri" aria-label="Zapri risanko">✕</button>`;
el.setAttribute("aria-label",r.t);el.classList.add("on");melodija();clearTimeout(risT);risT=setTimeout(zapriRis,5500)}
function zapriRis(){clearTimeout(risT);const el=$("#ris");el.classList.remove("on");el.innerHTML=""}

function ans(ok){const k=kid(),s=k.sklop,v=vaja(k),ws=words(),tot=ws.length*s.pon,w=ws[v.i%ws.length],kl=w.glas+"-"+w.poz;v.rep++;v.i++;if(ok){v.ok++;k.zvezde++}
const st=k.stat[kl]||(k.stat[kl]=[0,0]);st[1]++;if(ok)st[0]++;
if(v.rep>=tot){const d=danes();if(!k.dnevi.includes(d)){k.dnevi.push(d);k.dnevi=k.dnevi.slice(-90)}
  let nova=null;if(k.nagradaDan!==d&&k.nalepke<ST.length){k.nalepke++;nova=ST[k.nalepke-1]}k.nagradaDan=d;
  save();render();cele(k,v,nova)}else{save();render()}}

let prejFokus=null;
function cele(k,v,nova){const c=$("#cele");const nal=nova?`<p>Nova nalepka: <span style="font-size:40px">${nova}</span></p>`:k.nalepke>=ST.length?`<p>Zbral/-a si že vse nalepke! 🏆</p>`:`<p>Današnjo nalepko že imaš – jutri te čaka nova.</p>`;
c.innerHTML=`<div class="card"><div style="font-size:80px" aria-hidden="true">🎉</div><h2 id="celeT">Super, ${esc(k.ime)}!</h2><p style="font-size:20px">Zbral/-a si <b>${v.ok} ⭐</b></p>${nal}<p>🔥 Niz: ${niz(k)} ${niz(k)==1?"dan":"dni"}</p>${nova?`<button class="btn big ok" style="margin-bottom:10px" onclick="zapriCele();risanka('${nova}')">🎬 Poglej risanko</button>`:""}<button class="btn big" id="celeOk" onclick="zapriCele()">Naprej</button></div>`;
prejFokus=document.activeElement;c.classList.add("on");$("#celeOk").focus();
if(!matchMedia("(prefers-reduced-motion: reduce)").matches)for(let i=0;i<30;i++){const e=document.createElement("div");e.className="conf";e.textContent=["🎉","⭐","🎈","✨","🌈"][i%5];e.style.left=Math.random()*100+"vw";e.style.animationDelay=Math.random()*.8+"s";document.body.append(e);setTimeout(()=>e.remove(),3500)}}
function zapriCele(){$("#cele").classList.remove("on");const b=document.querySelector("#app button.big")||document.querySelector("#app button");(b&&document.contains(b)?b:prejFokus)?.focus()}
document.addEventListener("keydown",e=>{if(e.key=="Escape"&&$("#ris").classList.contains("on")){zapriRis();return}if(e.key=="Escape"&&$("#igra").classList.contains("on")){zapriIgro();return}if(e.key=="Escape"&&$("#cele").classList.contains("on"))zapriCele();if(e.key=="Tab"&&$("#cele").classList.contains("on")){e.preventDefault();const b=[...$("#cele").querySelectorAll("button")],i=b.indexOf(document.activeElement);b[(i+(e.shiftKey?b.length-1:1))%b.length].focus()}});

function stars(){const k=kid(),s=k.sklop,dn=dniTeden(k),st=s.sklopi.reduce((a,x)=>{const t=k.stat[x.glas+"-"+(s.stopnja=="poved"?"p":s.stopnja=="zgodba"?"g":x.poz)]||[0,0];return[a[0]+t[0],a[1]+t[1]]},[0,0]),p=st[1]?Math.round(st[0]/st[1]*100):0;return `<div class="phone" style="max-width:600px"><div class="card"><label for="ko" style="margin-top:0">Otrok</label><select id="ko" onchange="S.aktiven=+this.value;save();render()">${S.kids.map(x=>`<option value="${x.id}" ${x.id==k.id?"selected":""}>${esc(x.ime)}</option>`).join("")}</select></div>
${opomnik(k)}<div class="card"><h2 style="margin-top:0">Tedenski povzetek – ${esc(k.ime)}</h2><div class="row"><div class="stat"><small>Dni vadbe (urnik)</small><b>${dn} / ${planDni(k)}</b></div><div class="stat"><small>Pravilno (${s.sklopi.map(x=>x.glas).join(", ")})</small><b>${st[1]?p+" %":"–"}</b></div><div class="stat"><small>Nalepke</small><b>${k.nalepke} / ${ST.length}</b></div></div><p>${dn>=planDni(k)?"Odlično! Ta teden ste opravili ves urnik. 🌟":"Ta teden je opravljenih "+dn+" od "+planDni(k)+" dni po urniku. Tudi 5 minut je dovolj."}</p>${dayStrip(k)}</div>
<div class="card"><h3 style="margin-top:0">📅 Urnik in opomnik</h3><p class="mut" style="font-size:14px;margin-top:0">Urnik je predlagal logoped. Prilagodite ga lahko, kakor vam ustreza.</p>${urnikHTML(k,"s")}
<p style="margin:14px 0 6px"><b>Opomnik na telefonu</b></p><p class="mut" style="font-size:14px;margin:0 0 10px">Vaje dodajte v koledar, ki vas bo ob uri vaj opomnil na vsak dan z urnika. Če urnik spremenite, staro ponovitev v koledarju izbrišite in jo dodajte znova.</p>
<div class="row" style="gap:8px"><a class="btn" style="text-decoration:none" href="${googleKoledar(k)}" target="_blank" rel="noopener">📅 Dodaj v Google Koledar</a><button class="btn sec" onclick="icsDatoteka()">⬇ Datoteka za drug koledar</button></div></div>
<div class="card"><h3 style="margin-top:0">💬 Sporočila z logopedom</h3>${klepet(k,"stars")}</div>${oblakHTML("stars")}</div>`}

const OSNUTKI=["kodaVnos","msg-logoped","msg-stars","bw","bg","be","pg","px","nIme","nSt"];let rDela=false,rSe=false;
function render(){if(rDela){rSe=true;return}rDela=true;try{const app=$("#app"),os={},f=document.activeElement&&app.contains(document.activeElement)?document.activeElement.id:"";OSNUTKI.forEach(id=>{const e=document.getElementById(id);if(e)os[id]=e.value});
  tabs();app.innerHTML=S.vloga=="logoped"?logoped():S.vloga=="otrok"?otrok():stars();
  if(cisti)cisti=false;else for(const id in os){const e=document.getElementById(id);if(e)e.value=os[id]}
  if(f){const e=document.getElementById(f);if(e)try{e.focus({preventScroll:true})}catch(x){}}}finally{rDela=false}if(rSe){rSe=false;render()}}
let cisti=false;
render();
DB.keys().then(ks=>{REC=new Set(ks||[]);render()}).catch(()=>{}).then(oblakZagon);
