<!DOCTYPE html><html lang="sl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Moj zvezek vaj</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#ff8a5b">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{--bg:#fff8ef;--card:#fff;--ink:#2d2a32;--mut:#6b6570;--pri:#ff8a5b;--pri2:#ffb703;--ok:#2a9d8f;--sky:#8ecae6;--r:18px}
*{box-sizing:border-box}button{font-family:inherit}body{margin:0;font-family:system-ui,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink)}
header{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:12px 16px;background:#fff;box-shadow:0 2px 8px #0001;position:sticky;top:0;z-index:5}
header h1{font-size:18px;margin:0 auto 0 0}header h1 span{color:var(--pri)}
nav button{border:0;background:#f3ece4;padding:10px 14px;border-radius:999px;font-size:15px;cursor:pointer;margin:2px}
nav button[aria-selected=true]{background:var(--pri);color:#fff;font-weight:600}
main{max-width:1100px;margin:0 auto;padding:16px}
.card{background:var(--card);border-radius:var(--r);padding:16px;box-shadow:0 2px 10px #0000000d;margin-bottom:14px}
.grid{display:grid;grid-template-columns:300px 1fr;gap:16px}@media(max-width:800px){.grid{grid-template-columns:1fr}}
.kid{display:flex;align-items:center;gap:10px;padding:10px;border-radius:14px;cursor:pointer;border:2px solid transparent;width:100%;background:none;text-align:left;font:inherit}
.kid[aria-pressed=true]{border-color:var(--pri);background:#fff3ec}.av{font-size:28px;width:44px;height:44px;border-radius:50%;background:#ffe8d6;display:grid;place-items:center}
label{display:block;font-size:14px;color:var(--mut);margin:10px 0 4px}select,input,textarea{width:100%;padding:10px;border:1px solid #ddd;border-radius:10px;font:inherit}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chip{border:2px solid #eee;background:#fff;border-radius:12px;padding:8px 12px;font-size:17px;font-weight:700;cursor:pointer}.chip[aria-pressed=true]{border-color:var(--pri);background:#fff3ec}
.btn{border:0;border-radius:14px;padding:12px 18px;font-size:16px;font-weight:600;cursor:pointer;background:var(--pri);color:#fff}.btn.sec{background:#f3ece4;color:var(--ink)}
.btn.sm{padding:6px 10px;font-size:14px;border-radius:10px}.btn.rec{background:#e63946}
.row{display:flex;gap:12px;flex-wrap:wrap}.stat{flex:1;min-width:130px;background:#fff8ef;border-radius:14px;padding:12px}.stat b{font-size:26px;display:block}
.days{display:flex;gap:6px;flex-wrap:wrap}.day{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;font-size:12px;background:#eee}.day.on{background:var(--ok);color:#fff}.day.today{outline:2px solid var(--pri)}.day.plan:not(.on){box-shadow:inset 0 0 0 2px var(--pri2);background:#fff6dc}
.opo{padding:12px 16px;font-size:16px;border-left:6px solid var(--pri2)}.opo.zdaj{border-left-color:#e63946;background:#fff1f0}.opo.ok2{border-left-color:var(--ok);background:#eefaf7}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--mut);margin-top:6px}.legend i{display:inline-block;width:12px;height:12px;border-radius:4px;vertical-align:-1px;margin-right:4px}
.cmt{border-left:4px solid var(--sky);padding:6px 10px;margin:6px 0;background:#f6fbfd;border-radius:6px;font-size:14px}
.recrow{display:flex;align-items:center;gap:6px;padding:6px 0;border-bottom:1px solid #f1ebe4}.recrow b{flex:1;font-size:16px}
small,.mut{color:var(--mut)}
.phone{max-width:390px;margin:0 auto}
.big{font-size:22px;padding:18px;border-radius:20px;width:100%}
.wcard{text-align:center;padding:24px 16px}.pic{font-size:110px;line-height:1.1}.word{font-size:42px;font-weight:800;letter-spacing:1px;margin:8px 0}.word u{color:var(--pri);text-decoration-thickness:4px}
.prog{height:12px;background:#eee;border-radius:99px;overflow:hidden}.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--pri2),var(--pri))}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}.ok{background:var(--ok)}.again{background:var(--pri2);color:#3a2a00}
.stk{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;font-size:30px;text-align:center}.stk span{background:#fff8ef;border-radius:12px;padding:4px}.stk .lock{filter:grayscale(1);opacity:.25}
.cele{position:fixed;inset:0;background:#0006;display:none;place-items:center;z-index:9}.cele.on{display:grid}.cele .card{text-align:center;max-width:340px;animation:pop .5s}
@keyframes pop{0%{transform:scale(.5)}80%{transform:scale(1.08)}100%{transform:scale(1)}}
.conf{position:fixed;top:-40px;font-size:28px;animation:fall 2.4s linear forwards;z-index:10;pointer-events:none}@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
@media (prefers-reduced-motion:reduce){.conf{display:none}.cele .card{animation:none}}
footer{text-align:center;font-size:13px;color:var(--mut);padding:18px}
.stk button{background:#fff8ef;border:2px solid transparent;border-radius:12px;padding:4px;font-size:30px;cursor:pointer;line-height:1.2}.stk button:hover{border-color:var(--pri)}
/* Risanke */
.ris{position:fixed;inset:0;z-index:20;display:none;overflow:hidden;cursor:pointer}.ris.on{display:block}
.ris .act{position:absolute;transform:translate(-50%,-50%);line-height:1}.ris .act span{display:inline-block}
.ris .txt{font-weight:900;color:#e63946;text-shadow:3px 3px 0 #fff;font-family:system-ui,sans-serif}
.ris .cap{position:absolute;left:50%;bottom:calc(9% + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#fffffff0;color:#2d2a32;padding:12px 20px;border-radius:18px;font-size:22px;font-weight:800;text-align:center;width:max-content;max-width:88vw;animation:capin .6s 1s both}
.ris .bar{position:absolute;left:0;top:env(safe-area-inset-top,0px);height:6px;background:#ffffffb0;animation:bar 5s linear both}
.ris .zapri{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));right:calc(14px + env(safe-area-inset-right,0px))}
@keyframes bar{from{width:0}to{width:100%}}
@keyframes capin{from{opacity:0;transform:translate(-50%,20px)}to{opacity:1;transform:translate(-50%,0)}}
@keyframes rise{from{transform:translateY(60vh) scale(.3)}to{transform:none}}
@keyframes twinkle{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.3);opacity:.6}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
@keyframes across{from{transform:translateX(-80vw)}to{transform:translateX(80vw)}}
@keyframes walkin{from{transform:translateX(-70vw)}to{transform:none}}
@keyframes hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-24px)}}
@keyframes bubble{from{transform:translateY(0);opacity:0}15%{opacity:.8}to{transform:translateY(-75vh);opacity:0}}
@keyframes launch{0%,25%{transform:translateY(20vh)}100%{transform:translateY(-80vh)}}
@keyframes grow{from{transform:scale(0)}70%{transform:scale(1.15)}to{transform:scale(1)}}
@keyframes drop{0%{transform:translateY(-70vh)}60%{transform:translateY(0)}75%{transform:translateY(-30px)}100%{transform:translateY(0)}}
@keyframes spin{from{transform:scale(.2) rotate(-360deg)}to{transform:scale(1) rotate(0)}}
@keyframes float{from{transform:translate(0,45vh)}25%{transform:translate(-30px,20vh)}50%{transform:translate(30px,0)}75%{transform:translate(-20px,-20vh)}to{transform:translate(0,-40vh)}}
@keyframes slow{from{transform:translateX(-45vw)}to{transform:translateX(22vw)}}
@keyframes loop{0%{transform:translate(-40vw,-10vh)}25%{transform:translate(-10vw,-25vh)}50%{transform:translate(10vw,0)}75%{transform:translate(20vw,-15vh)}100%{transform:translate(28vw,14vh)}}
@keyframes fadeout{0%,40%{opacity:1}100%{opacity:0}}
@keyframes fadein{from{opacity:0}to{opacity:1}}
@keyframes shake{0%,100%{transform:rotate(0)}25%{transform:rotate(-10deg)}75%{transform:rotate(10deg)}}
@keyframes pop2{0%,55%{opacity:0;transform:scale(.4)}70%{opacity:1;transform:scale(1.25)}100%{opacity:1;transform:scale(1)}}
@media (prefers-reduced-motion:reduce){.ris *{animation:none!important}}
:focus-visible{outline:3px solid #1d4ed8;outline-offset:2px}
</style></head><body>
<header><h1>📒 Moj <span>zvezek</span> vaj</h1><button class="btn sm" id="namesti" hidden>📲 Namesti aplikacijo</button><nav role="tablist" id="tabs"></nav></header>
<main id="app"></main>
<div class="cele" id="cele" role="dialog" aria-modal="true" aria-labelledby="celeT"></div>
<div class="ris" id="ris" role="dialog" aria-modal="true" onclick="zapriRis()"></div>
<footer>Prototip – ni medicinski pripomoček; vaje določi logoped. · Vsi podatki so izmišljeni in shranjeni le v tem brskalniku.</footer>
<script>
/* ---------- Besede: [beseda, emoji] ----------
   Konec besede pri Z in Ž je namenoma izpuščen (razzvenevanje: voz [vos], nož [noš]).
   Konec besede pri L je izpuščen, dokler logoped ne potrdi seznama (končni l se pogosto izgovori kot [u]). */
const W={
S:{z:[["sok","🧃"],["sonce","☀️"],["sir","🧀"],["sova","🦉"]],s:[["osa","🐝"],["pesek","🏖️"],["lisica","🦊"],["kosilo","🍽️"]],k:[["nos","👃"],["pes","🐶"],["las","💇"],["kokos","🥥"]]},
Z:{z:[["zajec","🐰"],["zob","🦷"],["zvezda","⭐"],["zebra","🦓"]],s:[["koza","🐐"],["vaza","🏺"],["miza","🪑"],["koruza","🌽"]]},
C:{z:[["cvet","🌸"],["copat","🥿"],["cesta","🛣️"],["citrona","🍋"]],s:[["ovca","🐑"],["ptica","🐦"],["jajce","🥚"],["kocka","🎲"]],k:[["lonec","🍲"],["zajec","🐰"],["palec","👍"],["konec","🏁"]]},
"Š":{z:[["šola","🏫"],["škatla","📦"],["šal","🧣"],["šopek","💐"]],s:[["miška","🐭"],["hiša","🏠"],["hruška","🍐"],["kaša","🥣"]],k:[["miš","🐁"],["koš","🧺"],["tuš","🚿"],["kokoš","🐔"]]},
"Ž":{z:[["žoga","⚽"],["žaba","🐸"],["žlica","🥄"],["žirafa","🦒"]],s:[["roža","🌹"],["luža","💧"],["kuža","🐶"],["ježek","🦔"]]},
"Č":{z:[["čebela","🐝"],["čaj","🍵"],["čevelj","👞"],["čoln","🛶"]],s:[["mačka","🐱"],["očala","👓"],["kača","🐍"],["račka","🐤"]],k:[["ključ","🔑"],["meč","🗡️"],["kolač","🥧"],["kovač","🔨"]]},
L:{z:[["lev","🦁"],["luna","🌙"],["lonec","🍲"],["list","🍃"]],s:[["balon","🎈"],["kolo","🚲"],["pila","🪚"],["jabolko","🍎"]]},
R:{z:[["riba","🐟"],["roka","✋"],["raca","🦆"],["robot","🤖"]],s:[["ura","⏰"],["torba","👜"],["krava","🐄"],["žirafa","🦒"]],k:[["sir","🧀"],["tiger","🐯"],["kuhar","🧑‍🍳"],["mornar","⚓"]]}};
const POS={z:"začetek",s:"sredina",k:"konec"},ST=["⭐","🦄","🐙","🚀","🌈","🦖","🎈","🐢","🍓","🏆","🐝","🌻"];
const DN=["pon","tor","sre","čet","pet","sob","ned"];

/* ---------- Datumi ---------- */
const iso=d=>{const x=new Date(d);x.setMinutes(x.getMinutes()-x.getTimezoneOffset());return x.toISOString().slice(0,10)};
const danes=()=>iso(new Date());
const premik=n=>{const d=new Date();d.setDate(d.getDate()+n);return iso(d)};
function teden(){const dow=(new Date().getDay()+6)%7;return DN.map((_,i)=>premik(i-dow))}
function dniTeden(k){const t=teden();return t.filter(d=>k.dnevi.includes(d)).length}
function niz(k){const s=new Set(k.dnevi);const o=s.has(danes())?0:-1;let n=0;while(s.has(premik(o-n)))n++;return n}

/* ---------- Podatki ---------- */
function seed(){const d=a=>a.map(premik);return {v:2,aktiven:1,vloga:"logoped",kids:[
{id:1,ime:"Lana",starost:5,av:"🦊",sklop:{glas:"Š",poz:"z",pon:2,opomba:"Vadite zjutraj, ko je Lana spočita. Pohvalite vsak poskus."},dnevi:d([-1,-2,-3,-5]),stat:{"Š-z":[34,46],"S-z":[40,44]},kom:["Pri besedi škatla se je še malo zatikalo, šola gre odlično!","Lana je sama prosila za vaje 😊"],zvezde:41,nalepke:5,nagradaDan:null,vaja:null},
{id:2,ime:"Jakob",starost:6,av:"🐻",sklop:{glas:"R",poz:"s",pon:3,opomba:"Pred vajo naj se igra z jezikom (»konjiček«)."},dnevi:d([-1,-2,-4]),stat:{"R-s":[18,40],"L-z":[30,33]},kom:["R v sredini še težko, pri »ura« je bil zelo ponosen."],zvezde:22,nalepke:3,nagradaDan:null,vaja:null},
{id:3,ime:"Ema",starost:4,av:"🐼",sklop:{glas:"C",poz:"k",pon:2,opomba:"Kratke vaje, največ 5 minut."},dnevi:d([-1,-2,-3,-4,-5]),stat:{"C-k":[38,42],"S-z":[25,30],"Z-z":[20,28]},kom:["Vsak dan po vrtcu, gre ji vedno bolje.","Zajec je njena najljubša kartica."],zvezde:63,nalepke:7,nagradaDan:null,vaja:null}]}}
function load(){try{const x=JSON.parse(localStorage.getItem("pzv2"));if(x&&x.v===2&&Array.isArray(x.kids))return x}catch(e){}return seed()}
let S=load();
function save(){try{localStorage.setItem("pzv2",JSON.stringify(S))}catch(e){}}

/* ---------- Posnetki (IndexedDB) ---------- */
const DB=(()=>{let p;const open=()=>p||(p=new Promise((res,rej)=>{const r=indexedDB.open("pzv-posnetki",1);r.onupgradeneeded=()=>r.result.createObjectStore("rec");r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}));
const tx=(m,fn)=>open().then(db=>new Promise((res,rej)=>{const t=db.transaction("rec",m),q=fn(t.objectStore("rec"));t.oncomplete=()=>res(q&&q.result);t.onerror=()=>rej(t.error)}));
return{get:k=>tx("readonly",s=>s.get(k)),put:(k,v)=>tx("readwrite",s=>s.put(v,k)),del:k=>tx("readwrite",s=>s.delete(k)),keys:()=>tx("readonly",s=>s.getAllKeys())}})();
let REC=new Set(),mr=null,recW=null;

/* ---------- Dodajanje / odstranjevanje otrok ---------- */
let dodaj=false,novAv="🐰";const AV=["🦊","🐻","🐼","🐰","🐸","🐯","🦁","🐨","🐵","🦄"];
const leta=n=>n==1?"leto":n==2?"leti":n<5?"leta":"let";
function dodajForm(){if(!dodaj)return `<button class="btn sec" style="width:100%;margin-top:8px" onclick="dodaj=true;render();setTimeout(()=>{const i=$('#nIme');if(i)i.focus()})">➕ Dodaj otroka</button>`;
return `<form onsubmit="return dodajOtroka(event)" style="margin-top:10px;border-top:1px solid #f1ebe4;padding-top:6px"><label for="nIme">Ime</label><input id="nIme" name="ime" required maxlength="30" autocomplete="off"><label for="nSt">Starost (let)</label><input id="nSt" name="st" type="number" min="1" max="18" value="5"><label>Ikona</label><div class="chips">${AV.map(a=>`<button type="button" class="chip" aria-pressed="${novAv==a}" aria-label="Ikona ${a}" onclick="novAv='${a}';this.parentNode.querySelectorAll('.chip').forEach(c=>c.setAttribute('aria-pressed',c===this))">${a}</button>`).join("")}</div><div class="row" style="margin-top:12px"><button class="btn" type="submit">Shrani</button><button class="btn sec" type="button" onclick="dodaj=false;render()">Prekliči</button></div></form>`}
function dodajOtroka(e){e.preventDefault();const f=e.target,ime=f.ime.value.trim(),st=Math.min(18,Math.max(1,Math.round(+f.st.value)||5));if(!ime){f.ime.focus();return false}
const id=Math.max(0,...S.kids.map(k=>k.id))+1;S.kids.push({id,ime,starost:st,av:novAv,sklop:{sklopi:[{glas:"S",poz:"z"}],pon:2,opomba:""},dnevi:[],stat:{},kom:[],zvezde:0,nalepke:0,nagradaDan:null,vaja:null,urnik:{dni:[1,1,1,1,1,0,0],ura:"17:00"}});
S.aktiven=id;dodaj=false;save();render();toast2(ime+" je dodan/-a. Zdaj mu/ji dodelite vaje.");return false}
function odstrani(id){if(S.kids.length<2){toast2("Ostati mora vsaj en otrok.");return}const k=S.kids.find(x=>x.id==id)||kid();if(!confirm("Odstranim otroka "+k.ime+" in vse njegove podatke?"))return;S.kids=S.kids.filter(x=>x.id!==k.id);if(!S.kids.some(x=>x.id==S.aktiven))S.aktiven=S.kids[0].id;save();render();toast2(k.ime+" je odstranjen/-a.")}

/* ---------- Pomožne ---------- */
const $=s=>document.querySelector(s),kid=()=>S.kids.find(k=>k.id==S.aktiven)||S.kids[0],esc=t=>String(t).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const lbl=k=>{const[g,p]=k.split("-");return g+" · "+POS[p]};
const opis=k=>k.sklop.sklopi.map(x=>x.glas+" · "+POS[x.poz]).join(", ");
/* Besede vseh dodeljenih glasov, izmenično (Š, R, Š, R …), da je vaja bolj pestra. */
function besede(k){const L=k.sklop.sklopi.map(x=>W[x.glas][x.poz].map(([w,e])=>({w,e,glas:x.glas,poz:x.poz}))),out=[];const n=Math.max(...L.map(l=>l.length));for(let i=0;i<n;i++)L.forEach(l=>{if(l[i])out.push(l[i])});return out}
function words(){return besede(kid())}
function vaja(k){if(!k.vaja||k.vaja.datum!==danes())k.vaja={datum:danes(),i:0,rep:0,ok:0};return k.vaja}
function fixSklop(k){const s=k.sklop;if(!Array.isArray(s.sklopi))s.sklopi=[{glas:s.glas||"S",poz:s.poz||"z"}];delete s.glas;delete s.poz;
  s.sklopi=s.sklopi.filter((x,i,a)=>W[x.glas]&&a.findIndex(y=>y.glas==x.glas)==i);s.sklopi.forEach(x=>{if(!W[x.glas][x.poz])x.poz=Object.keys(W[x.glas])[0]});
  if(!s.sklopi.length)s.sklopi=[{glas:"S",poz:"z"}];s.pon=Math.min(5,Math.max(1,Math.round(+s.pon)||1))}
/* ---------- Lastne besede logopeda (na voljo vsem otrokom) ---------- */
const W0=JSON.parse(JSON.stringify(W));
if(!Array.isArray(S.lastne))S.lastne=[];
function zgradiW(){Object.keys(W).forEach(g=>delete W[g]);Object.assign(W,JSON.parse(JSON.stringify(W0)));
  S.lastne.forEach(x=>{const g=W[x.glas]||(W[x.glas]={}),l=g[x.poz]||(g[x.poz]=[]);if(!l.some(y=>y[0]==x.w))l.push([x.w,x.e||"🗣️"])})}
zgradiW();
function preveriPoz(w,g,p){const l=w.toLowerCase(),G=g.toLowerCase();if(p=="z")return l.startsWith(G);if(p=="k")return l.endsWith(G);const i=l.indexOf(G,1);return i>0&&i<l.length-G.length}
function dodajBesedo(e){e.preventDefault();const f=e.target,w=f.bw.value.trim().toLowerCase(),g=f.bg.value.trim().toUpperCase(),p=f.bp.value,em=f.be.value.trim().slice(0,8)||"🗣️";
  if(!w||!g){toast2("Vpišite besedo in glas.");return false}
  if(!/^[A-ZČŠŽĆĐ]{1,3}$/.test(g)){toast2("Glas naj bo ena ali dve črki, npr. K ali LJ.");return false}
  if(!/^[a-zčšžćđ]+$/.test(w)){toast2("Beseda naj vsebuje samo črke.");return false}
  if(!preveriPoz(w,g,p)){toast2("Beseda »"+w+"« nima glasu "+g+" na položaju »"+POS[p]+"«.");return false}
  if(((W[g]||{})[p]||[]).some(y=>y[0]==w)){toast2("Ta beseda je že v seznamu.");return false}
  S.lastne.push({w,e:em,glas:g,poz:p});zgradiW();save();render();toast2("Beseda »"+w+"« je dodana h glasu "+g+".");return false}
function odstraniBesedo(i){const x=S.lastne[i];if(!x)return;S.lastne.splice(i,1);zgradiW();S.kids.forEach(fixSklop);save();render();toast2("Beseda »"+x.w+"« je odstranjena.")}

/* ---------- Urnik in opomnik ---------- */
function fixKid(k){fixSklop(k);if(!k.urnik||!Array.isArray(k.urnik.dni))k.urnik={dni:[1,1,1,1,1,0,0],ura:"17:00"}}
S.kids.forEach(fixKid);
const DNI_ICS=["MO","TU","WE","TH","FR","SA","SU"],dan=()=>(new Date().getDay()+6)%7;
function setDan(i){const u=kid().urnik;u.dni[i]=u.dni[i]?0:1;if(!u.dni.some(Boolean)){u.dni[i]=1;toast2("Izberite vsaj en dan.");return}save();render()}
function setUra(v){if(/^\d\d:\d\d$/.test(v)){kid().urnik.ura=v;save();render()}}
function urnikHTML(k,p){const u=k.urnik;return `<div class="chips" role="group" aria-label="Dnevi vaj">${DN.map((d,i)=>`<button class="chip" style="font-size:15px" aria-pressed="${!!u.dni[i]}" onclick="setDan(${i})">${d}</button>`).join("")}</div>
<label for="ura-${p}">Ura vaj</label><input id="ura-${p}" type="time" value="${u.ura}" onchange="setUra(this.value)" style="max-width:160px">`}
function opomnik(k){const u=k.urnik,d=dan();
  if(k.dnevi.includes(danes()))return `<div class="card opo ok2" role="status">✅ Današnje vaje so opravljene. Bravo!</div>`;
  if(!u.dni[d]){const n=[1,2,3,4,5,6,7].map(x=>(d+x)%7).find(x=>u.dni[x]);return `<div class="card opo" role="status">📅 Danes ni vaj. Naslednje vaje: <b>${DN[n]} ob ${u.ura}</b>.</div>`}
  const[h,m]=u.ura.split(":").map(Number),now=new Date(),zdaj=now.getHours()*60+now.getMinutes()>=h*60+m;
  return `<div class="card opo ${zdaj?"zdaj":""}" role="status">${zdaj?`⏰ <b>Čas je za vaje!</b> Na urniku so bile ob ${u.ura}.`:`⏰ Danes so na urniku vaje ob <b>${u.ura}</b>.`}</div>`}
function prviTermin(u){const d=dan(),[h,m]=u.ura.split(":").map(Number),off=[0,1,2,3,4,5,6].find(x=>u.dni[(d+x)%7]),t=new Date();t.setDate(t.getDate()+off);t.setHours(h,m,0,0);return t}
const fmt=x=>x.getFullYear()+String(x.getMonth()+1).padStart(2,"0")+String(x.getDate()).padStart(2,"0")+"T"+String(x.getHours()).padStart(2,"0")+String(x.getMinutes()).padStart(2,"0")+"00";
const naslov=()=>location.href.split(/[?#]/)[0];
function googleKoledar(k){const u=k.urnik,st=prviTermin(u),en=new Date(st.getTime()+10*60000),by=u.dni.map((v,i)=>v?DNI_ICS[i]:null).filter(Boolean).join(",");
  return "https://calendar.google.com/calendar/render?action=TEMPLATE&text="+encodeURIComponent("Logopedske vaje – "+k.ime)+"&dates="+fmt(st)+"/"+fmt(en)+"&ctz=Europe/Ljubljana&recur="+encodeURIComponent("RRULE:FREQ=WEEKLY;BYDAY="+by)+"&details="+encodeURIComponent("Odpri Moj zvezek vaj: "+naslov())}
function icsDatoteka(){const k=kid(),u=k.urnik,st=prviTermin(u),by=u.dni.map((v,i)=>v?DNI_ICS[i]:null).filter(Boolean).join(",");
  const t=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Moj zvezek vaj//SL","BEGIN:VEVENT","UID:vaje-"+k.id+"-"+Date.now()+"@zvezek","DTSTAMP:"+fmt(new Date()),"DTSTART:"+fmt(st),"DURATION:PT10M","RRULE:FREQ=WEEKLY;BYDAY="+by,"SUMMARY:Logopedske vaje – "+k.ime,"DESCRIPTION:Odpri Moj zvezek vaj: "+naslov(),"BEGIN:VALARM","ACTION:DISPLAY","TRIGGER:PT0M","DESCRIPTION:Čas je za vaje","END:VALARM","END:VEVENT","END:VCALENDAR"].join("\r\n");
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([t],{type:"text/calendar"}));a.download="vaje-"+k.ime.toLowerCase().replace(/[^a-zčšž0-9]+/g,"-")+".ics";document.body.append(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000)}
function knjiznica(){return `<div class="card"><h3 style="margin-top:0">📚 Knjižnica besed</h3><p class="mut" style="font-size:14px;margin-top:0">Dodajte svoje besede, tudi za nove glasove (npr. K, G, LJ). Na voljo so vsem otrokom. Posnetek besede se samodejno uporabi pri vseh otrocih, ki jo vadijo.</p>
<form onsubmit="return dodajBesedo(event)"><label for="bw">Beseda</label><input id="bw" name="bw" maxlength="20" autocomplete="off" placeholder="npr. kapa">
<div class="row" style="gap:8px"><div style="flex:1;min-width:80px"><label for="bg">Glas</label><input id="bg" name="bg" list="glasovi" maxlength="3" placeholder="npr. K" autocomplete="off" style="text-transform:uppercase"><datalist id="glasovi">${Object.keys(W).map(x=>`<option value="${x}">`).join("")}</datalist></div>
<div style="flex:2;min-width:140px"><label for="bp">Položaj</label><select id="bp" name="bp">${Object.entries(POS).map(([v,t])=>`<option value="${v}">${t} besede</option>`).join("")}</select></div>
<div style="flex:1;min-width:80px"><label for="be">Sličica</label><input id="be" name="be" maxlength="8" placeholder="🧢" autocomplete="off"></div></div>
<p style="margin-bottom:0"><button class="btn" type="submit">➕ Dodaj besedo</button></p></form>
${S.lastne.length?`<h4 style="margin:14px 0 4px">Moje besede (${S.lastne.length})</h4>`+S.lastne.map((x,i)=>`<div class="recrow"><span style="font-size:22px" aria-hidden="true">${esc(x.e)}</span><b>${mark(x.w,x.glas,x.poz)}</b><small class="mut">${esc(x.glas)} · ${POS[x.poz]}${REC.has(x.w)?" · 🎙️":""}</small><button class="btn sec sm" onclick="odstraniBesedo(${i})" aria-label="Odstrani besedo ${esc(x.w)}">🗑</button></div>`).join(""):""}
<h4 style="margin:14px 0 4px">Posnete besede (${REC.size})</h4>${REC.size?`<div class="chips">${[...REC].sort().map(w=>`<button class="chip" style="font-size:14px;padding:4px 10px" data-w="${esc(w)}" onclick="predvajaj(this.dataset.w)" aria-label="Predvajaj ${esc(w)}">▶ ${esc(w)}</button>`).join("")}</div>`:`<p class="mut" style="font-size:14px;margin:0">Še ni posnetkov. Besede posnemite v razdelku Posnetki besed.</p>`}</div>`}
function setGlas(g){const k=kid(),a=k.sklop.sklopi,i=a.findIndex(x=>x.glas==g);if(i>=0){if(a.length<2){toast2("Otrok mora imeti vsaj en glas.");return}a.splice(i,1)}else a.push({glas:g,poz:Object.keys(W[g])[0]});fixSklop(k);save();render()}
function setPoz(g,p){const k=kid(),x=k.sklop.sklopi.find(x=>x.glas==g);if(x)x.poz=p;fixSklop(k);save();render()}
function setPon(v){const k=kid();k.sklop.pon=v;fixSklop(k);save();render()}
function dodeli(){const k=kid();k.vaja={datum:danes(),i:0,rep:0,ok:0};save();render();const t=$("#toast");if(t)t.textContent="✔ Vaje so dodeljene: "+k.ime}
function mark(w,g,p){const l=w.toLowerCase(),G=g.toLowerCase();let i=p=="z"?0:p=="k"?l.lastIndexOf(G):l.indexOf(G,1);if(i<0)return esc(w);return esc(w.slice(0,i))+"<u>"+esc(w.slice(i,i+G.length))+"</u>"+esc(w.slice(i+G.length))}
function toast2(m){const p=document.createElement("div");p.className="card";p.setAttribute("role","status");p.style.cssText="position:fixed;bottom:60px;left:50%;transform:translateX(-50%);z-index:8;max-width:340px";p.textContent=m;document.body.append(p);setTimeout(()=>p.remove(),2800)}

/* ---------- Zvok ---------- */
async function snemaj(w){
  if(mr){mr.stop();return}
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia||!window.MediaRecorder){naloziPosnetek(w);return}
  try{const st=await navigator.mediaDevices.getUserMedia({audio:true});const r=new MediaRecorder(st),ch=[];
    r.ondataavailable=e=>{if(e.data.size)ch.push(e.data)};
    r.onstop=async()=>{st.getTracks().forEach(t=>t.stop());mr=null;recW=null;
      if(ch.length){try{await DB.put(w,new Blob(ch,{type:r.mimeType||"audio/webm"}));REC.add(w);toast2("Posnetek »"+w+"« je shranjen.")}catch(e){toast2("Posnetka ni bilo mogoče shraniti.")}}
      render()};
    r.start();mr=r;recW=w;render();setTimeout(()=>{if(mr===r)r.stop()},4000)
  }catch(e){toast2("Mikrofon ni dovoljen. Tapnite 📁 in besedo posnemite z aplikacijo telefona.")}}
function naloziPosnetek(w){const i=document.createElement("input");i.type="file";i.accept="audio/*";i.setAttribute("capture","");
  i.onchange=async()=>{const f=i.files&&i.files[0];if(!f)return;try{await DB.put(w,f);REC.add(w);toast2("Posnetek »"+w+"« je shranjen.")}catch(e){toast2("Posnetka ni bilo mogoče shraniti.")}render()};i.click()}
async function predvajaj(w){try{const b=await DB.get(w);if(!b)throw 0;const a=new Audio(URL.createObjectURL(b));a.onended=()=>URL.revokeObjectURL(a.src);await a.play()}catch(e){toast2("Posnetka ni mogoče predvajati – besedo preberite na glas.")}}
async function izbrisi(w){try{await DB.del(w);REC.delete(w)}catch(e){}render()}

const TABS=[["logoped","🩺 Logoped"],["otrok","🧒 Otrok + starš"],["stars","👪 Starš"]];
function tabs(){$("#tabs").innerHTML=TABS.map(([v,t])=>`<button role="tab" aria-selected="${S.vloga==v}" onclick="S.vloga='${v}';save();render()">${t}</button>`).join("")}
function dayStrip(k){const t=teden(),d=danes();return `<div class="days">${t.map((x,i)=>`<div class="day ${k.dnevi.includes(x)?"on":""} ${k.urnik.dni[i]?"plan":""} ${x==d?"today":""}" title="${DN[i]} ${x}${k.urnik.dni[i]?" · na urniku":""}">${DN[i]}</div>`).join("")}</div><div class="legend"><span><i style="background:var(--ok)"></i>vadil/-a</span><span><i style="background:#fff6dc;box-shadow:inset 0 0 0 2px var(--pri2)"></i>na urniku</span></div>`}
const planDni=k=>k.urnik.dni.filter(Boolean).length;
function chart(k){const e=Object.entries(k.stat).filter(([,[,t]])=>t>0);if(!e.length)return "<p class='mut'>Še ni podatkov.</p>";
return `<svg viewBox="0 0 400 ${e.length*46+10}" width="100%" role="img" aria-label="Delež pravilnih izgovorjav po glasovih in položajih">`+e.map(([g,[o,t]],i)=>{const p=Math.round(o/t*100),y=i*46+8;return `<text x="0" y="${y+21}" font-size="16" font-weight="700" fill="#2d2a32">${esc(lbl(g))}</text><rect x="130" y="${y}" width="200" height="30" rx="8" fill="#f3ece4"/><rect x="130" y="${y}" width="${2*p}" height="30" rx="8" fill="${p>=75?'#2a9d8f':p>=50?'#ffb703':'#ff8a5b'}"/><text x="340" y="${y+21}" font-size="16" fill="#2d2a32">${p} %</text>`}).join("")+"</svg>"}

function logoped(){const k=kid(),s=k.sklop,ws=besede(k).map(x=>[x.w]);return `<div class="grid"><div><div class="card"><h2 style="margin-top:0">Moji otroci</h2>${S.kids.map(x=>`<div style="display:flex;align-items:center;gap:4px"><button class="kid" aria-pressed="${x.id==k.id}" onclick="S.aktiven=${x.id};save();render()"><span class="av">${x.av}</span><span><b>${esc(x.ime)}</b><br><small>${x.starost} ${leta(x.starost)} · ${x.sklop.sklopi.length>1?"glasovi":"glas"} ${x.sklop.sklopi.map(y=>y.glas).join(", ")}</small></span></button><button class="btn sec sm" onclick="odstrani(${x.id})" aria-label="Odstrani otroka ${esc(x.ime)}" title="Odstrani otroka">🗑</button></div>`).join("")}${dodajForm()}</div>
<div class="card"><h3 style="margin-top:0">Dodeli vaje za domov</h3><label>Glasovi (izberete lahko več)</label><div class="chips">${Object.keys(W).map(g=>`<button class="chip" aria-pressed="${s.sklopi.some(x=>x.glas==g)}" onclick="setGlas('${g}')">${g}</button>`).join("")}</div>
<label>Položaj v besedi</label>${s.sklopi.map(x=>`<div class="row" style="align-items:center;gap:8px;margin-bottom:6px"><b style="width:28px;font-size:18px">${x.glas}</b><select id="poz-${x.glas}" aria-label="Položaj za glas ${x.glas}" style="flex:1" onchange="setPoz('${x.glas}',this.value)">${Object.keys(W[x.glas]).map(v=>`<option value="${v}" ${x.poz==v?"selected":""}>${POS[v]} besede</option>`).join("")}</select></div>`).join("")}
<label for="pon">Ponovitve na dan (1–5)</label><input id="pon" type="number" min="1" max="5" step="1" value="${s.pon}" onchange="setPon(this.value)">
<label>Urnik vaj (starš ga lahko prilagodi)</label>${urnikHTML(k,"l")}
<label for="op">Opomba za starše</label><textarea id="op" rows="3" onchange="kid().sklop.opomba=this.value;save()">${esc(s.opomba)}</textarea>
<p class="mut" style="font-size:14px">Besede: ${s.sklopi.map(x=>`<b>${x.glas}</b>: ${W[x.glas][x.poz].map(w=>mark(w[0],x.glas,x.poz)).join(", ")}`).join(" · ")}<br>${ws.length*s.pon} kartic na dan</p>
<button class="btn" onclick="dodeli()">Dodeli vaje</button> <span id="toast" class="mut" role="status"></span></div>
<div class="card"><h3 style="margin-top:0">🎙️ Posnetki besed</h3><p class="mut" style="font-size:14px;margin-top:0">Posnemite pravilno izgovorjavo. Otrok bo slišal vaš glas. Snemanje se ustavi samo po 4 sekundah. Če mikrofon ni dovoljen (npr. na telefonu), tapnite 📁 in posnemite z aplikacijo telefona.</p>
${[...new Set(ws.map(x=>x[0]))].map(w=>`<div class="recrow"><b>${esc(w)}</b>${REC.has(w)?`<button class="btn sec sm" data-w="${esc(w)}" onclick="predvajaj(this.dataset.w)" aria-label="Predvajaj ${esc(w)}">▶</button>`:""}<button class="btn sm ${recW==w?"rec":"sec"}" data-w="${esc(w)}" onclick="snemaj(this.dataset.w)" ${mr&&recW!=w?"disabled":""}>${recW==w?"⏹ Ustavi":REC.has(w)?"● Znova":"● Posnemi"}</button><button class="btn sec sm" data-w="${esc(w)}" onclick="naloziPosnetek(this.dataset.w)" aria-label="Posnemi ali izberi posnetek v telefonu za ${esc(w)}" title="Posnemi z aplikacijo telefona ali izberi datoteko">📁</button>${REC.has(w)&&recW!=w?`<button class="btn sec sm" data-w="${esc(w)}" onclick="izbrisi(this.dataset.w)" aria-label="Izbriši posnetek ${esc(w)}">🗑</button>`:""}</div>`).join("")}</div>${knjiznica()}</div>
<div><div class="card"><div class="row" style="justify-content:space-between;align-items:center"><h2 style="margin:0">${k.av} ${esc(k.ime)} – napredek ta teden</h2><button class="btn sec sm" onclick="odstrani()">🗑 Odstrani otroka</button></div><div class="row"><div class="stat"><small>Dni vadbe (urnik)</small><b>${dniTeden(k)} / ${planDni(k)}</b></div><div class="stat"><small>Niz dni</small><b>🔥 ${niz(k)}</b></div><div class="stat"><small>Zvezdice</small><b>⭐ ${k.zvezde}</b></div><div class="stat"><small>Trenutni sklop</small><b style="font-size:17px">${opis(k)}</b></div></div>

<div class="two"><button class="btn big ok" onclick="ans(1)">✅ Pravilno</button><button class="btn big again" onclick="ans(0)">💪 Še vadimo</button></div></div>
${s.opomba?`<div class="card"><small>📝 Logoped: ${esc(s.opomba)}</small></div>`:""}${rewards(k)}</div>`}
function znova(){const k=kid();k.vaja={datum:danes(),i:0,rep:0,ok:0};save();render()}

let risT=null;
function melodija(){try{const C=window.AudioContext||window.webkitAudioContext;if(!C)return;const c=new C(),t0=c.currentTime;[523,659,784,1047,784,1047].forEach((f,i)=>{const o=c.createOscillator(),g=c.createGain(),t=t0+i*.18;o.type="triangle";o.frequency.value=f;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.15,t+.02);g.gain.exponentialRampToValueAtTime(.001,t+.3);o.connect(g).connect(c.destination);o.start(t);o.stop(t+.35)});setTimeout(()=>c.close(),2500)}catch(e){}}
function risanka(e){const r=RIS[e];if(!r)return;const el=$("#ris");el.style.background=r.bg;
el.innerHTML=`<div class="bar"></div>`+r.a.map(([t,x,y,s,m,n,f])=>`<span class="act" aria-hidden="true" style="left:${x}%;top:${y}%;font-size:${s}px"><span style="${f?"transform:"+f:""}"><span style="animation:${m||"none"}"><span class="${/^[A-Z]/.test(t)?"txt":""}" style="animation:${n||"none"}">${t}</span></span></span></span>`).join("")+`<div class="cap">${r.t}</div><button class="btn sec sm zapri" aria-label="Zapri risanko">✕</button>`;
el.setAttribute("aria-label",r.t);el.classList.add("on");melodija();clearTimeout(risT);risT=setTimeout(zapriRis,5500)}
function zapriRis(){clearTimeout(risT);const el=$("#ris");el.classList.remove("on");el.innerHTML=""}

function ans(ok){const k=kid(),s=k.sklop,v=vaja(k),ws=words(),tot=ws.length*s.pon,w=ws[v.i%ws.length],kl=w.glas+"-"+w.poz;v.rep++;v.i++;if(ok){v.ok++;k.zvezde++}
const st=k.stat[kl]||(k.stat[kl]=[0,0]);st[1]++;if(ok)st[0]++;
if(v.rep>=tot){const d=danes();if(!k.dnevi.includes(d)){k.dnevi.push(d);k.dnevi=k.dnevi.slice(-90)}
  let nova=null;if(k.nagradaDan!==d&&k.nalepke<ST.length){k.nalepke++;nova=ST[k.nalepke-1]}k.nagradaDan=d;
  save();render();cele(k,v,nova)}else{save();render()}}

let prejFokus=null;
function cele(k,v,nova){const c=$("#cele");const nal=nova?`<p>Nova nalepka: <span style="font-size:40px">${nova}</span></p>`:k.nalepke>=ST.length?`<p>Zbral/-a si že vse nalepke! 🏆</p>`:`<p>Današnjo nalepko že imaš – jutri te čaka nova.</p>`;
c.innerHTML=`<div class="card"><div style="font-size:80px" aria-hidden="true">🎉</div><h2 id="celeT">Super, ${esc(k.ime)}!</h2><p style="font-size:20px">Zbral/-a si <b>${v.ok} ⭐</b></p>${nal}<p>🔥 Niz: ${niz(k)} ${niz(k)==1?"dan":"dni"}</p>${nova?`<button class="btn big ok" style="margin-bottom:10px" onclick="zapriCele();risanka('${nova}')">🎬 Poglej risanko</button>`:""}<button class="btn big" id="celeOk" onclick="zapriCele()">Naprej</button></div>`;
prejFokus=document.activeElement;c.classList.add("on");$("#celeOk").focus();
if(!matchMedia("(prefers-reduced-motion: reduce)").matches)for(let i=0;i<30;i++){const e=document.createElement("div");e.className="conf";e.textContent=["🎉","⭐","🎈","✨","🌈"][i%5];e.style.left=Math.random()*100+"vw";e.style.animationDelay=Math.random()*.8+"s";document.body.append(e);setTimeout(()=>e.remove(),3500)}}
function zapriCele(){$("#cele").classList.remove("on");const b=document.querySelector("#app button.big")||document.querySelector("#app button");(b&&document.contains(b)?b:prejFokus)?.focus()}
document.addEventListener("keydown",e=>{if(e.key=="Escape"&&$("#ris").classList.contains("on")){zapriRis();return}if(e.key=="Escape"&&$("#cele").classList.contains("on"))zapriCele();if(e.key=="Tab"&&$("#cele").classList.contains("on")){e.preventDefault();$("#celeOk").focus()}});

function stars(){const k=kid(),s=k.sklop,dn=dniTeden(k),st=s.sklopi.reduce((a,x)=>{const t=k.stat[x.glas+"-"+x.poz]||[0,0];return[a[0]+t[0],a[1]+t[1]]},[0,0]),p=st[1]?Math.round(st[0]/st[1]*100):0;return `<div class="phone" style="max-width:600px"><div class="card"><label for="ko" style="margin-top:0">Otrok</label><select id="ko" onchange="S.aktiven=+this.value;save();render()">${S.kids.map(x=>`<option value="${x.id}" ${x.id==k.id?"selected":""}>${esc(x.ime)}</option>`).join("")}</select></div>
${opomnik(k)}<div class="card"><h2 style="margin-top:0">Tedenski povzetek – ${esc(k.ime)}</h2><div class="row"><div class="stat"><small>Dni vadbe (urnik)</small><b>${dn} / ${planDni(k)}</b></div><div class="stat"><small>Pravilno (${s.sklopi.map(x=>x.glas).join(", ")})</small><b>${st[1]?p+" %":"–"}</b></div><div class="stat"><small>Nalepke</small><b>${k.nalepke} / ${ST.length}</b></div></div><p>${dn>=planDni(k)?"Odlično! Ta teden ste opravili ves urnik. 🌟":"Ta teden je opravljenih "+dn+" od "+planDni(k)+" dni po urniku. Tudi 5 minut je dovolj."}</p>${dayStrip(k)}</div>
<div class="card"><h3 style="margin-top:0">📅 Urnik in opomnik</h3><p class="mut" style="font-size:14px;margin-top:0">Urnik je predlagal logoped. Prilagodite ga lahko, kakor vam ustreza.</p>${urnikHTML(k,"s")}
<p style="margin:14px 0 6px"><b>Opomnik na telefonu</b></p><p class="mut" style="font-size:14px;margin:0 0 10px">Vaje dodajte v koledar, ki vas bo ob uri vaj opomnil na vsak dan z urnika. Če urnik spremenite, staro ponovitev v koledarju izbrišite in jo dodajte znova.</p>
<div class="row" style="gap:8px"><a class="btn" style="text-decoration:none" href="${googleKoledar(k)}" target="_blank" rel="noopener">📅 Dodaj v Google Koledar</a><button class="btn sec" onclick="icsDatoteka()">⬇ Datoteka za drug koledar</button></div></div>
<div class="card"><h3 style="margin-top:0">Sporočilo za logopeda</h3><label for="msg">Kako so potekale vaje? Kaj je bilo težko?</label><textarea id="msg" rows="4" placeholder="Npr. Pri besedi … se še zatika."></textarea><p><button class="btn" onclick="const v=$('#msg').value.trim();if(v){kid().kom.unshift(v);save();render();toast2('Sporočilo je shranjeno za logopeda.')}">Shrani sporočilo</button></p>${k.kom.map(c=>`<div class="cmt">${esc(c)}</div>`).join("")}</div></div>`}
